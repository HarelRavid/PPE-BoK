name: One-shot Chapter 014 canonical integration

on:
  push:
    branches:
      - chapter-014-engineering-development

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run controlled Chapter 014 canonical integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled development branch
        uses: actions/checkout@v4
        with:
          ref: chapter-014-engineering-development
          fetch-depth: 0

      - name: Integrate approved Investigation 9 and 10 candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('chapters/chapter-014-atomic-structure-chemical-bonding-carbon-chemistry')
          chapter_path = root / 'chapter.md'
          inv9_path = root / 'investigation-009-authoring.md'
          inv10_path = root / 'investigation-010-authoring.md'
          review_path = root / 'review.md'
          outline_path = root / 'technical-outline.md'
          cdb_path = Path('docs/PDS/Chapter-Design-Briefs/CDB-014-Atomic-Structure-Chemical-Bonding-Carbon-Chemistry.md')
          workflow_path = Path('.github/workflows/chapter014-canonical-integration.yml')

          for p in [chapter_path, inv9_path, inv10_path, review_path, outline_path, cdb_path]:
              assert p.exists(), f'Missing required controlled file: {p}'

          original = chapter_path.read_text(encoding='utf-8')
          assert original.count('# Investigation 9') == 1
          assert original.count('# Investigation 10') == 1
          assert '**Authoring state:** BLOCKED' in original

          prefix = original.split('# Investigation 9', 1)[0].rstrip() + '\n\n'

          def clean_authoring(path: Path, heading: str, number: str) -> str:
              text = path.read_text(encoding='utf-8')
              start = text.index(heading)
              text = text[start:]
              sep = text.find('\n---\n')
              assert 0 < sep < 1500, f'Controlled preamble separator not found in {path}'
              text = heading + '\n\n' + text[sep + len('\n---\n'):].lstrip()
              # Normalize temporary authoring hierarchy into canonical chapter hierarchy.
              text = re.sub(rf'(?m)^## ({number}\.\d+\.\d+.*?)$', r'### \1', text)
              text = re.sub(rf'(?m)^# ({number}\.\d+.*?)$', r'## \1', text)
              return text.strip() + '\n'

          inv9 = clean_authoring(inv9_path, '# Investigation 9 — How Do Molecular Features Become Engineering-Property Hypotheses?', '9')
          inv10 = clean_authoring(inv10_path, '# Investigation 10 — What Can Chemistry Tell Us, and Where Must the Engineer Stop?', '10')

          # TR-014-01 — reserve Level 1–6 for the final evidence ladder.
          prefix = prefix.replace('After Investigation 1, the engineer should be able to classify a statement into one of three levels:',
                                  'After Investigation 1, the engineer should be able to classify a statement into one of three claim classes:')
          prefix = prefix.replace('### Level 1 — Chemistry fact', '### Claim Class A — Chemistry fact')
          prefix = prefix.replace('### Level 2 — Mechanism hypothesis', '### Claim Class B — Mechanism hypothesis')
          prefix = prefix.replace('### Level 3 — Engineering conclusion', '### Claim Class C — Engineering conclusion')
          prefix = prefix.replace('**Never jump directly from Level 1 to Level 3.**', '**Never jump directly from Claim Class A to Claim Class C.**')
          prefix = prefix.replace('make Level 1 accurate and Level 2 useful', 'make Claim Class A accurate and Claim Class B useful')
          prefix = prefix.replace('needed to reach Level 3', 'needed to reach Claim Class C')

          # TAB-014-002 is finalized in Investigation 9; keep the Investigation 6 table as an unnumbered preview.
          prefix = prefix.replace('## 6.9 TAB-014-002 — Carbon feature → mechanism → evidence boundary',
                                  '## 6.9 Carbon feature → mechanism → evidence boundary — preliminary teaching table')

          # TR-014-04 — integrate the Investigation 9 wording controls.
          inv9 = inv9.replace('morphology, free volume, crystallinity, copolymer structure and processing.',
                              'morphology, packing/free-volume effects, crystallinity, copolymer structure and processing.')
          inv9 = inv9.replace('- amorphous free volume;', '- packing / morphology-related free-volume effects;')
          inv9 = inv9.replace('crystallinity, density/free volume, copolymer structure, film/test configuration',
                              'crystallinity, density/packing/free-volume interpretation, copolymer structure, film/test configuration')
          inv9 = inv9.replace('## 9.9 FIG-014-006 — Molecular feature to engineering evidence chain — scientific specification',
                              '## 9.9 Evidence-chain design requirements for FIG-014-006')

          # Avoid two canonical versions of WF-014-001. Investigation 9 now validates the sequence; Investigation 10 owns the final workflow.
          wf_start = inv9.index('## 9.10 WF-014-001')
          ver_start = inv9.index('## 9.11 Verification')
          inv9 = (
              inv9[:wf_start]
              + '## 9.10 Workflow checkpoint before the final chapter decision tool\n\n'
                'Cases A–C have now validated the reasoning sequence used throughout this Investigation:\n\n'
                '`observe structure → state mechanism hypothesis → define measurable property → obtain direct evidence → identify confounders → set transferability boundary → qualify → decide`\n\n'
                'The final controlled `WF-014-001` is intentionally placed in Investigation 10, where the scientific reasoning track is joined to product/application qualification and the chapter stop-rule.\n\n'
                '---\n\n'
              + inv9[ver_start:]
          )

          # TR-014-03 / E10-01 — explicit non-normative status of the PPE-BoK evidence ladder.
          ladder_needle = 'A useful way to prevent overclaiming is to separate evidence into levels.\n'
          ladder_note = ('\n> **PPE-BoK framework:** The following levels are a PPE-BoK reasoning framework for controlling evidence transfer; '
                         'they are not a normative classification defined by a single standard.\n')
          assert ladder_needle in inv10
          inv10 = inv10.replace(ladder_needle, ladder_needle + ladder_note, 1)
          inv10 = inv10.replace('# Chapter 014 engineering closure — candidate text', '# Chapter engineering closure')

          asset_tail = '''# Chapter engineering assets — current register

| ID | Asset | Status |
|---|---|---|
| FIG-014-001 | Atom-to-material hierarchy | Placeholder integrated; graphic production pending |
| FIG-014-002 | Primary Bonding and Noncovalent Interaction Map | Scientific specification complete; graphic production pending |
| FIG-014-003 | Carbon hybridization and geometry | Scientific specification complete; graphic production pending |
| FIG-014-004 | Sigma and pi bonding in ethene | Scientific specification complete; graphic production pending |
| FIG-014-005 | Ethene to polyethylene bridge | Scientific specification complete; graphic production pending |
| FIG-014-006 | Molecular feature to engineering evidence chain | Final scientific specification integrated; graphic production pending |
| TAB-014-001 | Bonding types and engineering relevance | Integrated |
| TAB-014-002 | Molecular feature / likely mechanism / invalid direct conclusion | Integrated in Investigation 9 |
| TAB-014-003 | Controlled structure–property teaching cases | Integrated; Investigation 9 authoring review PASS |
| TAB-014-004 | Downstream chapter ownership crosswalk | Integrated in Investigation 10 |
| EX-014-001 | Reading ethene and PE repeat unit | Integrated; final full-chapter review pending |
| EX-014-002 | Comparing two simple polymer hypotheses | Integrated; Investigation 9 authoring review PASS |
| WF-014-001 | Chemical structure → evidence → engineering decision boundary | Final chapter version integrated |
| CL-014-001 | Before inferring engineering behaviour from chemical structure | Integrated |

---

# Publication hold points

Chapter 014 has completed its approved Engineering Development arc, but publication closure is not implied.

Before publication, the chapter still requires:

- final full-file Technical Review after canonical integration;
- current ISO 472 / ISO 1043-1 lifecycle and terminology validation;
- current IUPAC term/version and polymer-nomenclature validation;
- final claim-level verification of the Investigation 9 primary-study wording and citations;
- asset-register / cross-reference consistency check;
- Editorial / Style Review;
- final continuous-manuscript Desk Test;
- final figure production where required for publishing;
- explicit author review / Human Approval Gate;
- synchronization with current `main` and controlled merge.

No chemistry, vocabulary source or primary-study result in this chapter independently authorizes a piping material, pressure, temperature, chemical service, permeability allowance, lifetime or joining condition.

# References

See `references.md` for the controlled Chapter 014 source and evidence register.
'''

          assembled = prefix.rstrip() + '\n\n' + inv9.strip() + '\n\n---\n\n' + inv10.strip() + '\n\n---\n\n' + asset_tail

          # TR-014-02 — use the scientifically clearer asset terminology throughout controlled chapter architecture files.
          assembled = assembled.replace('Primary and secondary bonding map', 'Primary Bonding and Noncovalent Interaction Map')
          assembled = assembled.replace('Primary and secondary bonding', 'Primary Bonding and Noncovalent Interaction')

          # Canonical integration assertions.
          assert assembled.count('# Investigation 9 —') == 1
          assert assembled.count('# Investigation 10 —') == 1
          assert '**Authoring state:** BLOCKED' not in assembled
          assert '**Authoring state:** planned' not in assembled
          assert 'Claim Class A — Chemistry fact' in assembled
          assert 'Never jump directly from Claim Class A to Claim Class C' in assembled
          assert 'PPE-BoK reasoning framework for controlling evidence transfer' in assembled
          assert '## 6.9 TAB-014-002' not in assembled
          assert '## 9.3 TAB-014-002' in assembled
          assert '## 9.10 WF-014-001' not in assembled
          assert '## 10.5 WF-014-001' in assembled
          assert 'Primary Bonding and Noncovalent Interaction Map' in assembled
          assert 'Controlled authoring file' not in assembled
          assert len(assembled.splitlines()) > 2200

          chapter_path.write_text(assembled, encoding='utf-8')

          # Synchronize architecture/support files without changing CDB scope.
          for path in [outline_path, cdb_path]:
              t = path.read_text(encoding='utf-8')
              t = t.replace('Primary and secondary bonding map', 'Primary Bonding and Noncovalent Interaction Map')
              t = t.replace('Primary and secondary bonding', 'Primary Bonding and Noncovalent Interaction')
              path.write_text(t, encoding='utf-8')

          outline = outline_path.read_text(encoding='utf-8')
          outline = outline.replace(
              'Investigation 1 may be authored now under the current evidence plan. Later Investigations shall not be authored ahead of their required evidence research merely to accelerate chapter completion.',
              'Investigations 1–10 have now been authored through their required evidence checkpoints. Canonical integration has been completed; final full-chapter Technical Review and downstream validation gates remain required before Ready-for-Review.'
          )
          checkpoint = '''\n\n## 8. Engineering Development completion checkpoint — 2026-08-14\n\n- Investigations 1–8: authored controlled candidates.\n- Investigation 9: primary-literature gate PASS; authoring review PASS; canonical integration complete.\n- Investigation 10 / chapter closure: authoring review PASS; canonical integration complete.\n- Pre-integration Technical Review: CONDITIONAL PASS; TR-014-01 through TR-014-04 applied during integration.\n- Next gate: final full-file Technical Review of the integrated manuscript.\n\nThis checkpoint does not imply Standards/Evidence Validation, Editorial/Style Review, Human Approval or publication readiness.\n'''
          if '## 8. Engineering Development completion checkpoint — 2026-08-14' not in outline:
              outline = outline.rstrip() + checkpoint
          outline_path.write_text(outline, encoding='utf-8')

          review = review_path.read_text(encoding='utf-8')
          review_checkpoint = '''\n\n## 11. Canonical-integration checkpoint — 2026-08-14\n\nInvestigations 9–10 were integrated into `chapter.md` only after their controlled authoring reviews and the pre-integration Technical Review. The integration applied TR-014-01 through TR-014-04, including claim-class/evidence-level disambiguation, noncovalent-interaction terminology for FIG-014-002, explicit non-normative labeling of the PPE-BoK evidence ladder, and Investigation 9 transferability wording controls.\n\n**Current disposition:** Engineering Development arc integrated; final full-file Technical Review is the next gate. Standards/Evidence Validation, Editorial/Style Review, final Desk Test, Human Approval and merge remain open.\n'''
          if '## 11. Canonical-integration checkpoint — 2026-08-14' not in review:
              review = review.rstrip() + review_checkpoint
          review_path.write_text(review, encoding='utf-8')

          # Temporary authoring files are no longer part of the canonical development package.
          inv9_path.unlink()
          inv10_path.unlink()

          # This workflow is intentionally one-shot and removes itself from the resulting branch tree.
          workflow_path.unlink()

          print(f'Integrated canonical chapter lines: {len(assembled.splitlines())}')
          PY

      - name: Validate and commit integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e chapters/chapter-014-atomic-structure-chemical-bonding-carbon-chemistry/investigation-009-authoring.md
          test ! -e chapters/chapter-014-atomic-structure-chemical-bonding-carbon-chemistry/investigation-010-authoring.md
          test ! -e .github/workflows/chapter014-canonical-integration.yml
          grep -q 'Claim Class A — Chemistry fact' chapters/chapter-014-atomic-structure-chemical-bonding-carbon-chemistry/chapter.md
          grep -q 'PPE-BoK reasoning framework for controlling evidence transfer' chapters/chapter-014-atomic-structure-chemical-bonding-carbon-chemistry/chapter.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate Chapter 014 Investigations 9-10 canonically'
          git push origin HEAD:chapter-014-engineering-development
